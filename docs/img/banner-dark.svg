<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320">
  <defs>
    <linearGradient id="aurora" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="25%" stop-color="#fb923c"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="75%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1e"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="0.8" fill="#ffffff" opacity="0.06"/>
    </pattern>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0"/>
      <stop offset="30%" stop-color="#fb923c" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#f43f5e" stop-opacity="0.2"/>
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="penGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="320" fill="url(#bg-grad)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>

  <!-- Aurora glow behind the gradient line -->
  <ellipse cx="640" cy="52" rx="600" ry="40" fill="url(#glow)"/>

  <!-- Gradient line -->
  <rect x="80" y="48" width="1120" height="3" rx="1.5" fill="url(#aurora)"/>

  <!-- Document + signature icon -->
  <g transform="translate(1080, 160)" opacity="0.18">
    <!-- Document -->
    <rect x="-50" y="-65" width="90" height="115" rx="6" fill="none" stroke="#facc15" stroke-width="2.5"/>
    <line x1="-35" y1="-40" x2="25" y2="-40" stroke="#facc15" stroke-width="2"/>
    <line x1="-35" y1="-22" x2="25" y2="-22" stroke="#facc15" stroke-width="2"/>
    <line x1="-35" y1="-4" x2="10" y2="-4" stroke="#facc15" stroke-width="2"/>
    <!-- Signature line -->
    <path d="M -38 30 Q -20 18, -5 28 T 25 25" fill="none" stroke="url(#penGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Pen nib -->
    <path d="M 50 -30 L 75 -55 L 82 -48 L 57 -23 Z" fill="url(#penGrad)"/>
    <path d="M 50 -30 L 57 -23 L 48 -14 Z" fill="#f43f5e"/>
    <circle cx="78" cy="-51" r="2" fill="#facc15"/>
  </g>

  <!-- Title -->
  <text x="80" y="155" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Monaco, 'Courier New', monospace" font-size="42" font-weight="700" fill="#f1f5f9" letter-spacing="-0.5">
    react-native-docusign
  </text>

  <!-- Subtitle -->
  <text x="80" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" fill="#fb923c" font-style="italic">
    Native DocuSign SDK wrapper for React Native and Expo
  </text>

  <!-- Description -->
  <text x="80" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#6b7280">
    In-app captive signing on iOS and Android, no browser handoff
  </text>

  <!-- Bottom accent dots -->
  <circle cx="80" cy="275" r="3" fill="#facc15" opacity="0.6"/>
  <circle cx="95" cy="275" r="3" fill="#fb923c" opacity="0.6"/>
  <circle cx="110" cy="275" r="3" fill="#f43f5e" opacity="0.6"/>
  <circle cx="125" cy="275" r="3" fill="#a855f7" opacity="0.6"/>
  <circle cx="140" cy="275" r="3" fill="#3b82f6" opacity="0.6"/>
</svg>
